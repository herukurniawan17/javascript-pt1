<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Object</title>
</head>
<body>


  <script>
    const product = {
      name: 'socks',
      price: 1090
    };

    console.log(product);
    console.log(product.name);

    product.name = 'cotton socks';
    product.price = 2050;

    console.log(product);

    product.sepatu = 5000;
    console.log(product);

    delete product.sepatu;
    console.log(product);
    
  </script>
</body>
