<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock paper scissors</title>
</head>
<body>

  <!-- this project create rock paper scissors -->
  <p>Rock Paper Scissors</p>

  <button onclick="
  playerGuess('rock')
  ">Rock</button>

  <button onclick="

    playerGuess('paper')
  ">Paper</button>

  <button onclick="
    
    playerGuess('scissors')
   
  ">Scissors</button>

  <script>
    function playerGuess(guess) {
      const computerSimple = pickComputerSimple();
      let result = '';

      if (guess === 'scissors') {
        if (computerSimple === 'rock') {
          result = 'lose';
        } else if (computerSimple === 'paper') {
          result = 'win';
        } else if (computerSimple === 'scissors') {
          result = 'tie';
        }

      }else if (guess === 'paper') {
        if (computerSimple === 'rock') {
          result = 'win';
        } else if (computerSimple === 'paper') {
          result = 'tie';
        } else if (computerSimple === 'scissors') {
          result = 'lose';
        }

      }else if (guess === 'rock') {
        if (computerSimple === 'rock') {
          result = 'tie';
        } else if (computerSimple === 'paper') {
          result = 'lose';
        } else if (computerSimple === 'scissors') {
          result = 'win';
        }
      }
      
      alert(`You pick ${guess}, Computer picked ${computerSimple} and You ${result}`);

    }
    

    function pickComputerSimple() {
      const randomNumber = Math.random();

      if (randomNumber >= 0 && randomNumber < 1/3 ) {
        computerSimple = 'rock';
      } else if (randomNumber >= 1/3 && randomNumber < 2/3 ) {
        computerSimple = 'paper';
      } else if (randomNumber >= 2/3 && randomNumber < 1) {
        computerSimple = 'scissors';
      }

      return computerSimple;
    }
  </script>
</body>
</html>
